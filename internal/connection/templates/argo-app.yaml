apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .AppName }}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MyDecisive/octant-sandbox.git
    targetRevision: main
    path: .
    kustomize:
      namePrefix: {{ .AppName }}-
  destination:
    name: in-cluster
    namespace: {{ .Namespace }}
  syncPolicy:
    automated:
      # required so that octant can manage manifests via sync
      enabled: false
      prune: false
      selfHeal: false